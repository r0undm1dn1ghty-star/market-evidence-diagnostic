  <text x="320" y="285" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#e6e9ef">DISCOVERY SYSTEM</text>
  <text x="320" y="315" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="14" letter-spacing="2" fill="#9aa7bd">evidence-first · open source</text>
